<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="posterTitle">
  <title id="posterTitle">Frozen frame of the recursion lesson at 04:12: the countdown() code with its base case highlighted, beside a preview of the call-stack diagram covered later in the video.</title>

  <rect width="1280" height="720" fill="#2e2b25" />
  <rect width="742" height="720" fill="#474238" />
  <line x1="742" y1="0" x2="742" y2="720" stroke="#2e2b25" stroke-width="2" />

  <!-- editor window chrome -->
  <circle cx="40" cy="38" r="7" fill="#8c491a" />
  <circle cx="64" cy="38" r="7" fill="#d9b98a" />
  <circle cx="88" cy="38" r="7" fill="#728157" />
  <rect x="120" y="26" width="118" height="24" rx="6" fill="#2e2b25" />
  <text x="179" y="42" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#c0b6a5" text-anchor="middle">countdown.py</text>

  <!-- current-line highlight, behind the code -->
  <rect x="0" y="192" width="742" height="88" fill="#8c491a" opacity="0.22" />
  <rect x="0" y="192" width="4" height="88" fill="#c67139" />

  <!-- code lines -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="19" xml:space="preserve">
    <text x="40" y="128" fill="#645c50">1</text>
    <text x="76" y="128"><tspan fill="#ffc6a5">def</tspan><tspan fill="#f9f4ed"> </tspan><tspan fill="#ccdbb2">countdown</tspan><tspan fill="#f9f4ed">(n):</tspan></text>

    <text x="40" y="164" fill="#645c50">2</text>
    <text x="76" y="164"><tspan fill="#f9f4ed">    </tspan></text>

    <text x="40" y="224" fill="#645c50">3</text>
    <text x="76" y="224"><tspan fill="#f9f4ed">    </tspan><tspan fill="#ffc6a5">if</tspan><tspan fill="#f9f4ed"> n == 0: </tspan><tspan fill="#ffc6a5">return</tspan><tspan fill="#f9f4ed">  </tspan><tspan fill="#a19786"># base case</tspan></text>

    <text x="40" y="260" fill="#645c50">4</text>
    <text x="76" y="260"><tspan fill="#f9f4ed">    </tspan><tspan fill="#ccdbb2">print</tspan><tspan fill="#f9f4ed">(n)</tspan></text>

    <text x="40" y="296" fill="#645c50">5</text>
    <text x="76" y="296"><tspan fill="#f9f4ed">    </tspan><tspan fill="#ccdbb2">countdown</tspan><tspan fill="#f9f4ed">(n - 1)</tspan><tspan fill="#f9f4ed">  </tspan><tspan fill="#a19786"># shrink the problem</tspan></text>
  </g>

  <text x="40" y="360" font-family="Figtree, system-ui, sans-serif" font-size="16" font-weight="700" fill="#f9f4ed">Every recursive call needs two parts.</text>
  <text x="40" y="388" font-family="Figtree, system-ui, sans-serif" font-size="15" fill="#c0b6a5">The base case — when to stop — and the case that shrinks the problem.</text>

  <!-- right panel: a preview of the not-yet-covered call-stack chapter -->
  <text x="782" y="72" font-family="Figtree, system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#ccdbb2" font-weight="700">COMING UP · CALL STACK</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="15" stroke-width="1.5">
    <rect x="782" y="98" width="180" height="46" rx="8" fill="#8c491a" fill-opacity="0.28" stroke="#c67139" />
    <text x="800" y="127" fill="#ffe1d0">countdown(3)</text>

    <rect x="812" y="152" width="180" height="46" rx="8" fill="#8c491a" fill-opacity="0.28" stroke="#c67139" />
    <text x="830" y="181" fill="#ffe1d0">countdown(2)</text>

    <rect x="842" y="206" width="180" height="46" rx="8" fill="none" stroke="#82796a" stroke-dasharray="5 5" />
    <text x="860" y="235" fill="#a19786">countdown(1)</text>

    <rect x="872" y="260" width="180" height="46" rx="8" fill="none" stroke="#82796a" stroke-dasharray="5 5" />
    <text x="890" y="284" fill="#a19786">countdown(0)</text>
    <text x="890" y="299" fill="#728157" font-size="11">base case → returns</text>
  </g>

  <line x1="1010" y1="330" x2="1010" y2="150" stroke="#728157" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#728157" />
    </marker>
  </defs>
  <text x="1010" y="348" font-family="Figtree, system-ui, sans-serif" font-size="11" fill="#728157" text-anchor="middle">grows, then unwinds</text>

  <!-- timestamp chip, like a real capture -->
  <rect x="1112" y="656" width="128" height="32" rx="16" fill="#2e2b25" fill-opacity="0.85" />
  <circle cx="1132" cy="672" r="4" fill="#c67139" />
  <text x="1144" y="677" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f9f4ed">04:12 / 12:38</text>
</svg>
