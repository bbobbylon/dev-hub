<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dev Hub — an interactive coding-learning app: lessons, quizzes, spaced-repetition flashcards, an algorithm visualizer and more, with real progress tracked locally in your browser."
    />
    <!-- Terracotta terminal glyph, matching --color-accent in organic.css. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c67139' stroke-width='2.75' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='4' width='20' height='16' rx='2'/%3E%3Cpath d='m6 9 3 3-3 3'/%3E%3Cpath d='M12 15h6'/%3E%3C/svg%3E"
    />
    <!-- Loaded here (not organic.css's old @import) so the font request starts
         alongside the HTML parse instead of after the CSS finishes loading. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap"
    />
    <title>Dev Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
